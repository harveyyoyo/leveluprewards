name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Theme contrast validation
        run: npm run test:themes

      - name: Firestore rules coverage
        run: node scripts/check-firestore-rule-coverage.mjs

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Dev-login is gated by this flag; keep it off in CI builds so the dev
      # toggle doesn't leak into a production-style bundle.
      - name: Build (production)
        run: npm run build
        env:
          NEXT_PUBLIC_ENABLE_DEV_LOGIN: 'false'
          NODE_ENV: production

      # Playwright starts `npm run start`. School login needs Firebase Admin
      # (same JSON secret as hosting deploy) or /api/auth/* returns 503.
      - name: Write Firebase Admin credentials for Playwright
        env:
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STUDIO_1273073612_71183 }}
        run: |
          if [ -z "$FIREBASE_SA_JSON" ]; then
            echo '::error::FIREBASE_SERVICE_ACCOUNT_STUDIO_1273073612_71183 secret missing — Playwright school login will 503.'
            exit 1
          fi
          node -e "const fs=require('fs');const sa=process.env.FIREBASE_SA_JSON||'';if(sa){fs.writeFileSync('.env','SSR_SERVICE_ACCOUNT_JSON='+JSON.stringify(sa)+'\n');}"

      - name: Playwright smoke tests
        run: npx playwright test e2e/auth.spec.ts
        env:
          CI: 'true'
          BASE_URL: 'http://127.0.0.1:3000'
          NEXT_PUBLIC_ENABLE_DEV_LOGIN: 'false'
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STUDIO_1273073612_71183 }}
          SSR_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STUDIO_1273073612_71183 }}
