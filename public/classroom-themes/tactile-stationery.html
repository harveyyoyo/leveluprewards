<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style type="text/tailwindcss">
  @theme {
    --color-canvas: #fbfaf5;
    --color-surface: #ffffff;
    --color-panel: #f2f0e6;
    --color-accent-blue: #3b82f6;
    --color-accent-green: #22c55e;
    --color-accent-red: #ef4444;
    --color-ink: #2d2d2d;
  }
</style>
<style>
  .tactile-card {
    box-shadow:
      0 1px 1px rgba(0,0,0,0.05),
      0 4px 0 0 rgba(0,0,0,0.05),
      0 8px 16px -4px rgba(0,0,0,0.1);
    transition: transform 0.1s ease, box-shadow 0.1s ease;
  }
  .tactile-card:active {
    transform: translateY(2px);
    box-shadow:
      0 1px 1px rgba(0,0,0,0.05),
      0 2px 0 0 rgba(0,0,0,0.05),
      0 4px 8px -2px rgba(0,0,0,0.1);
  }
  .sidebar-inset {
    box-shadow: inset 2px 2px 8px rgba(0,0,0,0.04);
  }
  .dotted-bg {
    background-image: radial-gradient(#d1d1cf 1px, transparent 1px);
    background-size: 24px 24px;
  }
</style>
</head>
<body>
<div class="flex h-screen w-full font-['Outfit'] text-ink bg-canvas">
  <aside class="w-72 bg-panel border-r border-black/5 flex flex-col p-6 gap-6 sidebar-inset">
    <div class="space-y-1">
      <h1 class="text-xl font-bold tracking-tight">Grade 5 • Room 302</h1>
      <p class="text-sm text-ink/60">Monday, Sept 18</p>
    </div>
    <div class="flex flex-col gap-3">
      <div class="flex items-center justify-between p-3 bg-white rounded-xl tactile-card border border-black/5">
        <span class="font-semibold">Quick Points</span>
        <div class="flex gap-1">
          <button class="size-8 rounded-lg bg-accent-green text-white font-bold grid place-items-center">+5</button>
          <button class="size-8 rounded-lg bg-accent-blue text-white font-bold grid place-items-center">+10</button>
        </div>
      </div>
      <button class="w-full py-3 bg-ink text-white rounded-xl font-medium shadow-lg active:translate-y-0.5 transition-transform">
        Random Student
      </button>
      <div class="space-y-2 mt-4">
        <label class="text-[10px] font-bold uppercase tracking-wider text-ink/40 px-1">Tools</label>
        <nav class="space-y-1">
          <div class="flex items-center gap-3 px-3 py-2 bg-black/5 rounded-lg font-medium">
            <div class="size-2 bg-accent-blue rounded-full"></div>
            Attendance
          </div>
          <div class="flex items-center gap-3 px-3 py-2 hover:bg-black/5 rounded-lg cursor-pointer text-ink/70">
            <div class="size-2 bg-transparent border border-ink/30 rounded-full"></div>
            Group Maker
          </div>
          <div class="flex items-center gap-3 px-3 py-2 hover:bg-black/5 rounded-lg cursor-pointer text-ink/70">
            <div class="size-2 bg-transparent border border-ink/30 rounded-full"></div>
            Quiet Timer
          </div>
        </nav>
      </div>
    </div>
    <div class="mt-auto p-4 bg-white/50 rounded-2xl border border-black/5 text-center">
      <p class="text-xs text-ink/50 mb-2">CLASS STREAK</p>
      <div class="text-2xl font-bold text-accent-green">12 Days</div>
    </div>
  </aside>
  <main class="flex-1 relative dotted-bg overflow-y-auto">
    <header class="sticky top-0 z-10 flex items-center justify-between px-10 py-6 bg-canvas/80 backdrop-blur-sm">
      <div class="flex gap-4">
        <div class="px-4 py-2 bg-white rounded-full tactile-card border border-black/5 flex items-center gap-3">
          <div class="size-2 rounded-full bg-accent-green"></div>
          <span class="text-sm font-semibold">22 Students Present</span>
        </div>
        <div class="px-4 py-2 bg-white rounded-full tactile-card border border-black/5 flex items-center gap-3">
          <span class="text-sm font-semibold">4 Absent</span>
        </div>
      </div>
      <div class="px-8 py-3 bg-ink text-white rounded-xl shadow-xl font-bold flex flex-col items-center">
        <span class="text-[10px] opacity-60 uppercase">Front of Class</span>
        <span>TEACHER DESK</span>
      </div>
      <div class="flex gap-3">
        <button class="size-10 bg-white rounded-full tactile-card border border-black/5 grid place-items-center">⚙️</button>
        <button class="size-10 bg-white rounded-full tactile-card border border-black/5 grid place-items-center">🔔</button>
      </div>
    </header>
    <div class="grid grid-cols-5 gap-8 p-10 max-w-7xl mx-auto" id="desk-grid"></div>
    <div class="fixed bottom-8 right-8 flex gap-4">
      <button class="px-6 py-4 bg-white rounded-2xl tactile-card border border-black/5 font-bold flex items-center gap-2">
        <span>+</span> Add New Student
      </button>
      <button class="px-6 py-4 bg-accent-blue text-white rounded-2xl tactile-card font-bold flex items-center gap-2">
        Save Layout
      </button>
    </div>
  </main>
</div>
<script>
const students = [
  ["AJ","Alex Johnson","1,240 pts","sky"],["BM","Bella Miller","985 pts","rose"],["CH","Caleb Hart","2,110 pts","emerald"],
  ["DP","Diana Prince","1,560 pts","amber"],["EW","Ethan Wong","840 pts","amber"],["FG","Felix Garcia","1,100 pts","indigo"],
  ["GT","Grace Tang","2,345 pts","purple"],["HB","Henry Baker","1,890 pts","orange"],["IS","Ivy Smith","670 pts","slate"],
  ["JD","John Doe","87 pts","sky"],["EW","Emily Ward","68 pts","rose"],["ZJ","Zoe Jenkins","1,779 pts","emerald"],
  ["JH","Jackson Hill","1,817 pts","indigo"],["AR","Aiden Reed","1,523 pts","purple"],["MM","Mia Miller","1,687 pts","orange"]
];
const grid = document.getElementById('desk-grid');
students.forEach(([init,name,pts,c]) => {
  grid.insertAdjacentHTML('beforeend', `
    <div class="group tactile-card bg-surface rounded-3xl p-4 border border-black/5 flex flex-col items-center gap-4 cursor-pointer hover:-translate-y-1">
      <div class="size-16 rounded-2xl bg-${c}-100 flex items-center justify-center border-2 border-${c}-200">
        <span class="text-xl font-bold text-${c}-700">${init}</span>
      </div>
      <div class="text-center">
        <h3 class="font-bold text-lg">${name}</h3>
        <p class="text-sm font-medium text-ink/50 bg-black/5 px-3 py-0.5 rounded-full mt-1">${pts}</p>
      </div>
    </div>`);
});
grid.insertAdjacentHTML('beforeend', `
  <div class="group tactile-card bg-surface rounded-3xl p-4 border border-black/5 flex flex-col items-center gap-4 cursor-pointer hover:-translate-y-1 border-b-4 border-b-accent-red/20">
    <div class="size-16 rounded-2xl bg-zinc-100 flex items-center justify-center border-2 border-zinc-200">
      <span class="text-xl font-bold text-zinc-400">??</span>
    </div>
    <div class="text-center">
      <h3 class="font-bold text-lg">Jack Reed</h3>
      <p class="text-sm font-medium text-accent-red bg-accent-red/10 px-3 py-0.5 rounded-full mt-1">ABSENT</p>
    </div>
  </div>`);
</script>
</body>
</html>
