<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;1,9..40,400&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<style type="text/tailwindcss">
@theme {
  --color-navy-950: #0f172a;
  --color-cream-50: #fdfbf7;
  --color-cream-100: #f9f6ef;
  --color-brand-teal: #0d9488;
  --color-brand-red: #e11d48;
  --color-brand-yellow: #f59e0b;
  --color-brand-purple: #9333ea;
  --font-display: 'Space Grotesk', sans-serif;
  --font-sans: 'DM Sans', sans-serif;
}
</style>
<style>
  .iso-container {
    perspective: 1200px;
  }
  .iso-card {
    transform: rotateX(12deg) rotateY(-8deg) rotateZ(4deg);
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .iso-card:hover {
    transform: rotateX(8deg) rotateY(-4deg) rotateZ(2deg) translateY(-4px);
  }
  .iso-shadow {
    box-shadow:
      1px 1px 0px #e4e4e7,
      2px 2px 0px #e4e4e7,
      3px 3px 0px #e4e4e7,
      4px 4px 0px #e4e4e7,
      12px 16px 24px -4px rgba(0,0,0,0.1);
  }
  .active-press:active {
    transform: translateY(2px);
    box-shadow: 1px 1px 0px rgba(0,0,0,0.1);
  }
  .dot-pattern {
    background-image: radial-gradient(circle at 1px 1px, #e5e7eb 1px, transparent 0);
    background-size: 24px 24px;
  }
</style>
</head>
<body>
<div class="flex h-screen bg-cream-50 font-sans text-zinc-800">
  <aside class="w-72 flex flex-col border-r border-zinc-950/5 bg-zinc-50 overflow-y-auto">
    <div class="p-6 space-y-6">
      <button class="w-full flex items-center justify-center gap-2 bg-brand-yellow text-zinc-950 font-medium py-2.5 rounded-lg ring-1 ring-brand-yellow/50 iso-shadow active-press text-sm">
        <span class="shrink-0">Arrange seats</span>
      </button>
      <div class="space-y-3">
        <div class="flex items-center justify-between text-xs font-semibold text-zinc-500 uppercase tracking-wider">
          <span>Awards</span>
        </div>
        <div class="bg-zinc-100/50 p-4 rounded-xl ring-1 ring-black/5">
          <p class="text-sm font-medium mb-3">+5 to Class</p>
          <div class="grid grid-cols-3 gap-2">
            <button class="py-2 px-1 text-xs font-medium bg-white ring-1 ring-black/5 rounded-md hover:bg-zinc-50 transition-colors">+1</button>
            <button class="py-2 px-1 text-xs font-medium bg-white ring-1 ring-black/5 rounded-md hover:bg-zinc-50 transition-colors">+2</button>
            <button class="py-2 px-1 text-xs font-medium bg-brand-teal text-white ring-1 ring-brand-teal/50 rounded-md transition-colors">+5</button>
            <button class="py-2 px-1 text-xs font-medium bg-white ring-1 ring-black/5 rounded-md hover:bg-zinc-50 transition-colors">+10</button>
            <button class="py-2 px-1 text-xs font-medium bg-white ring-1 ring-black/5 rounded-md hover:bg-zinc-50 transition-colors">+15</button>
            <button class="py-2 px-1 text-xs font-medium bg-white ring-1 ring-black/5 rounded-md hover:bg-zinc-50 transition-colors">+20</button>
          </div>
        </div>
      </div>
      <nav class="space-y-1">
        <button class="w-full flex items-center gap-3 py-2 pr-3 pl-2 text-sm font-medium text-zinc-600 hover:bg-zinc-100 rounded-md transition-colors">
          <div class="size-4 bg-zinc-200 rounded shrink-0"></div>
          <span>Random student</span>
        </button>
        <button class="w-full flex items-center gap-3 py-2 pr-3 pl-2 text-sm font-medium text-zinc-600 hover:bg-zinc-100 rounded-md transition-colors">
          <div class="size-4 bg-zinc-200 rounded shrink-0"></div>
          <span>Raffle wheel</span>
        </button>
        <button class="w-full flex items-center gap-3 py-2 pr-3 pl-2 text-sm font-medium text-zinc-600 hover:bg-zinc-100 rounded-md transition-colors">
          <div class="size-4 bg-zinc-200 rounded shrink-0"></div>
          <span>Behavior logs</span>
        </button>
      </nav>
      <div class="pt-4 border-t border-zinc-950/5 space-y-4">
        <div class="flex items-center justify-between">
          <span class="text-sm font-medium">Group timer</span>
          <span class="text-xs font-mono bg-zinc-200 px-2 py-0.5 rounded">00:00</span>
        </div>
        <div class="flex gap-2">
          <button class="flex-1 bg-zinc-950 text-white text-sm py-2 rounded-md active-press">Start</button>
          <button class="px-4 bg-zinc-200 text-zinc-600 text-sm py-2 rounded-md hover:bg-zinc-300 transition-colors">Reset</button>
        </div>
      </div>
    </div>
  </aside>
  <main class="flex-1 flex flex-col">
    <header class="h-16 bg-navy-950 flex items-center justify-between px-6 shrink-0 z-20">
      <div class="flex items-center gap-4">
        <div class="flex items-center gap-2 bg-white/10 px-3 py-1.5 rounded-lg">
          <span class="text-white text-sm font-medium">Grade 5</span>
          <div class="size-3 border-r-2 border-b-2 border-white/40 rotate-45 -translate-y-0.5"></div>
        </div>
        <div class="h-4 w-px bg-white/10"></div>
        <div class="flex gap-2">
          <span class="bg-brand-teal/20 text-brand-teal text-[10px] font-bold uppercase tracking-wider px-2 py-1 rounded-full">3/22 Present</span>
          <span class="bg-zinc-700/50 text-zinc-300 text-[10px] font-bold uppercase tracking-wider px-2 py-1 rounded-full">Hall: Clear</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <div class="bg-brand-yellow text-zinc-950 text-xs font-bold px-3 py-1.5 rounded-lg ring-2 ring-brand-yellow/30">
          +15 pts
        </div>
        <div class="flex gap-1 bg-white/5 p-1 rounded-lg">
          <button class="px-3 py-1 text-xs text-white/80 hover:text-white transition-colors">Projector</button>
          <button class="px-3 py-1 text-xs text-white/80 hover:text-white transition-colors">Cheatsheet</button>
          <button class="px-3 py-1 text-xs text-white/80 hover:text-white transition-colors">Shortcuts</button>
        </div>
      </div>
    </header>
    <div class="flex-1 overflow-auto dot-pattern p-12">
      <div class="max-w-6xl mx-auto">
        <div class="flex justify-center mb-16">
          <div class="iso-card iso-shadow bg-zinc-900 px-12 py-4 rounded-xl flex flex-col items-center">
            <span class="font-display text-white text-lg font-semibold tracking-tight">Teacher Desk</span>
            <span class="text-[10px] text-zinc-400 uppercase tracking-widest">Front of class</span>
          </div>
        </div>
        <div class="iso-container grid grid-cols-5 gap-y-16 gap-x-12" id="desk-grid"></div>
      </div>
    </div>
  </main>
</div>
<script>
const students = [
  ["JD","John","87 pts","teal"],["EW","Emily","68 pts","red"],["ZJ","Zoe","1,779 pts","yellow"],
  ["JH","Jackson","1,817 pts","teal"],["EH","Ethan","529 pts","red"],["JB","James","99 pts","teal"],
  ["EV","Evelyn","938 pts","purple"],["ET","Ethan","2,125 pts","teal"],["JW","Joseph","780 pts","red"],
  ["LB","Logan","1,506 pts","yellow"],["AL","Addison","2,020 pts","teal"],["MM","Mia","1,687 pts","red"],
  ["MG","Michael","376 pts","teal"],["AR","Aiden","1,523 pts","purple"],["MD","Madison","2,106 pts","teal"],
  ["OJ","Owen","1,689 pts","red"],["AY","Aria","1,882 pts","yellow"],["IB","Isabella","548 pts","teal"],
  ["PM","Penelope","1,724 pts","purple"],["WA","William","1,379 pts","teal"],["DA","David","132 pts","purple"]
];
const grid = document.getElementById('desk-grid');
students.forEach(([init,name,pts,c]) => {
  const textCls = c === 'yellow' ? 'text-zinc-900' : 'text-white';
  grid.insertAdjacentHTML('beforeend', `
    <div class="iso-card iso-shadow bg-white p-6 rounded-2xl flex flex-col items-center text-center ring-1 ring-black/5">
      <div class="size-14 rounded-full bg-brand-${c} flex items-center justify-center ${textCls} font-display text-xl outline-1 -outline-offset-1 outline-black/5 mb-4">
        ${init}
      </div>
      <h3 class="font-display text-lg font-semibold leading-none mb-1">${name}</h3>
      <div class="bg-zinc-900 text-white text-[11px] font-medium px-3 py-1 rounded-full">${pts}</div>
    </div>`);
});
grid.insertAdjacentHTML('beforeend', `
  <div class="iso-card iso-shadow bg-white p-6 rounded-2xl flex flex-col items-center text-center ring-1 ring-black/5 opacity-50">
    <div class="size-14 rounded-full bg-zinc-200 flex items-center justify-center text-zinc-400 font-display text-xl outline-1 -outline-offset-1 outline-black/5 mb-4">+</div>
    <h3 class="font-display text-sm font-semibold leading-none mb-1 text-zinc-400">Add Student</h3>
  </div>`);
</script>
</body>
</html>
