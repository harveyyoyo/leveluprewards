<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { width:1440px; height:900px; overflow:hidden; background:#F2EBDA; }
  .grotesk { font-family:'Space Grotesk',sans-serif; }
  .dmsans { font-family:'DM Sans',sans-serif; }
  .mat { background:#FFFCF2; border-radius:18px; box-shadow: 0 4px 0 rgba(70,55,25,0.14), 0 16px 30px rgba(70,55,25,0.14); }
  .btn3d { border-radius:14px; box-shadow: 0 5px 0 rgba(0,0,0,0.16), 0 10px 18px rgba(70,55,25,0.16); transition: transform .1s ease, box-shadow .1s ease; }
  .btn3d:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,0.16), 0 4px 8px rgba(70,55,25,0.16); }
  .chip { border-radius:9999px; box-shadow: 0 3px 0 rgba(0,0,0,0.14); }
  .die { width:52px; height:52px; border-radius:12px; background:linear-gradient(145deg,#FFFCF2,#EFE4CC); box-shadow: 0 5px 0 rgba(70,55,25,0.2), inset 0 3px 6px rgba(255,255,255,0.8); display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:6px; padding:10px; }
  .pip { width:9px; height:9px; border-radius:9999px; background:#2E2716; }
  .board-path { position:absolute; left:0; right:0; height:64px; display:flex; align-items:center; gap:0; opacity:.9; }
  .tile { width:64px; height:64px; border-radius:16px; flex-shrink:0; }
  .checkered { background-image: repeating-conic-gradient(rgba(70,55,25,0.045) 0% 25%, transparent 0% 50%); background-size: 56px 56px; }
</style>
</head>
<body class="dmsans text-[#3B3222]">
<div class="flex h-full">

  <!-- SIDEBAR : game box lid -->
  <aside class="w-[290px] shrink-0 flex flex-col px-5 pt-6 pb-5 bg-[#EDE4CE] border-r-4 border-[#D8C9A6]">
    <div class="mat px-5 py-5 mb-4">
      <div class="grotesk text-[24px] font-bold leading-tight text-[#2E2716]">Game Night</div>
      <div class="mt-1 text-[11px] font-bold uppercase tracking-[0.25em] text-[#B08D3E]">roll to play</div>
    </div>

    <div class="mat px-5 py-4 mb-4 flex items-center gap-4">
      <div class="die"><span class="pip"></span><span></span><span class="pip"></span><span></span><span class="pip"></span><span></span><span class="pip"></span><span></span><span class="pip"></span></div>
      <div class="flex-1">
        <div class="grotesk font-bold text-[11px] uppercase tracking-[0.18em] text-[#8A7A5A]">Roll the die</div>
        <div class="text-[11px] font-bold text-[#2E2716] mt-0.5">Sarah O'Neill's turn</div>
      </div>
    </div>

    <div class="flex-1 space-y-5 overflow-hidden px-1">
      <button class="btn3d w-full py-4 bg-gradient-to-b from-[#3D4E8D] to-[#2E3B6E] text-white grotesk font-bold text-sm tracking-wide">🎪 Arrange Seats</button>

      <div>
        <div class="flex items-center justify-between mb-3 px-1">
          <span class="grotesk font-bold text-[11px] uppercase tracking-[0.18em] text-[#8A7A5A]">Move Tokens</span>
          <span class="text-[9px] font-bold uppercase tracking-widest bg-[#C43D2E] text-white px-2 py-1 rounded-full chip">+5 steps</span>
        </div>
        <div class="grid grid-cols-3 gap-3">
          <button class="btn3d py-3 bg-gradient-to-b from-[#FFE9B8] to-[#FFD57E] text-[#7A5410] grotesk font-bold">+1</button>
          <button class="btn3d py-3 bg-gradient-to-b from-[#FFD1C4] to-[#F97F62] text-[#8A3A22] grotesk font-bold">+5</button>
          <button class="btn3d py-3 bg-gradient-to-b from-[#E3D5FF] to-[#A882F2] text-white grotesk font-bold">+10</button>
        </div>
      </div>

      <div class="space-y-2.5">
        <button class="btn3d w-full py-3.5 bg-gradient-to-b from-[#FFDE76] to-[#FFC53D] text-[#6E4E08] grotesk font-bold text-sm text-left px-5">🎯 Random Student</button>
        <button class="btn3d w-full py-3.5 bg-gradient-to-b from-[#C9AEFF] to-[#A882F2] text-white grotesk font-bold text-sm text-left px-5">🎫 Raffle Draw</button>
        <button class="btn3d w-full py-3.5 bg-gradient-to-b from-[#F97F62] to-[#E86A4C] text-white grotesk font-bold text-sm text-left px-5">📒 Behavior Log</button>
        <button class="btn3d w-full py-3.5 bg-gradient-to-b from-[#5FC4A0] to-[#3BA57F] text-white grotesk font-bold text-sm text-left px-5">🚌 Attendance Roll</button>
      </div>

      <div>
        <div class="grotesk font-bold text-[11px] uppercase tracking-[0.18em] text-[#8A7A5A] mb-2 px-1">⏳ Sand Timer</div>
        <div class="mat p-4 text-center">
          <div class="grotesk text-[38px] font-bold text-[#2E2716] leading-none">15:00</div>
          <div class="flex gap-2 mt-3">
            <button class="btn3d flex-1 py-2.5 bg-gradient-to-b from-[#5FC4A0] to-[#3BA57F] text-white text-xs grotesk font-bold uppercase">Start</button>
            <button class="btn3d flex-1 py-2.5 bg-gradient-to-b from-[#EFE4CC] to-[#E0D3B4] text-[#8A7A5A] text-xs grotesk font-bold uppercase">Reset</button>
          </div>
        </div>
      </div>
    </div>

    <button class="btn3d w-full py-3.5 mt-4 bg-gradient-to-b from-[#FFFCF2] to-[#EFE4CC] text-[#8A7A5A] grotesk font-bold text-xs uppercase tracking-widest">📖 Rulebook</button>
  </aside>

  <!-- CANVAS : the board -->
  <main class="flex-1 flex flex-col checkered">
    <header class="mx-8 mt-6 shrink-0 flex items-center justify-between px-2 pb-4 border-b-4 border-[#D8C9A6]">
      <div class="flex items-center gap-5">
        <button class="btn3d px-4 py-2 bg-gradient-to-b from-[#FFDE76] to-[#FFC53D] text-[#6E4E08] grotesk font-bold text-xs">Grade 5 ▾</button>
        <span class="text-[11px] font-bold uppercase tracking-[0.2em] flex items-center gap-2 text-[#8A7A5A]"><span class="w-2.5 h-2.5 rounded-full bg-[#3BA57F]"></span>12/22 present</span>
      </div>
      <div class="flex items-center gap-3">
        <button class="btn3d px-4 py-2 bg-gradient-to-b from-[#3D4E8D] to-[#2E3B6E] text-white text-[11px] grotesk font-bold">Projector</button>
        <button class="btn3d px-4 py-2 bg-gradient-to-b from-[#3D4E8D] to-[#2E3B6E] text-white text-[11px] grotesk font-bold">Shortcuts</button>
        <div class="w-9 h-9 rounded-full bg-gradient-to-b from-[#F97F62] to-[#E86A4C] flex items-center justify-center text-[10px] grotesk font-bold text-white chip">TR</div>
      </div>
    </header>

    <div class="flex-1 relative overflow-auto px-10 pt-8 pb-10">
      <div class="board-path -top-1" aria-hidden="true"></div>
      <div class="flex justify-center mb-9">
        <div class="mat px-12 py-4 text-center relative">
          <div class="absolute -top-3 -left-3 w-9 h-9 rounded-xl bg-gradient-to-b from-[#5FC4A0] to-[#3BA57F] text-white grotesk font-bold text-[9px] flex items-center justify-center rotate-[-8deg] chip">GO</div>
          <div class="text-[9px] grotesk font-bold uppercase tracking-[0.35em] text-[#B08D3E]">Start space</div>
          <div class="grotesk text-lg font-bold uppercase tracking-[0.18em] text-[#2E2716]">Teacher Desk</div>
        </div>
      </div>
      <div id="grid" class="grid grid-cols-5 gap-x-6 gap-y-8 max-w-[1060px] mx-auto"></div>
    </div>
  </main>
</div>

<script>
const students = [
  ["JD","John Davis","87 PTS","#F97F62","#FFD1C4","#8A3A22"],
  ["EW","Emily Ward","1.2K PTS","#5FC4A0","#B8EBD4","#1E6B4C"],
  ["ZJ","Zoe Jenkins","462 PTS","#FFC53D","#FFE9B8","#7A5410"],
  ["LH","Leo Hayes","890 PTS","#A882F2","#E3D5FF","#5B3A9E"],
  ["AB","Ava Brooks","2.1K PTS","#7FB8E8","#C4E2F8","#25598A"],
  ["KM","Kai Miller","66 PTS","#FFC53D","#FFE9B8","#7A5410"],
  ["SO","Sarah O'Neill","94 PTS","#5FC4A0","#B8EBD4","#1E6B4C"],
  ["RR","Ryan Reed","118 PTS","#A882F2","#E3D5FF","#5B3A9E"],
  ["MP","Mia Park","2.4K PTS","#F97F62","#FFD1C4","#8A3A22"],
  ["TL","Toby Long","1.9K PTS","#7FB8E8","#C4E2F8","#25598A"]
];
const grid = document.getElementById('grid');
students.forEach(([init,name,pts,c,cLight,cText], i) => {
  grid.insertAdjacentHTML('beforeend', `
  <div class="mat relative px-3 py-6 text-center cursor-pointer hover:-translate-y-1.5 transition-transform">
    <div class="absolute -top-2.5 -left-2.5 w-8 h-8 rounded-full flex items-center justify-center grotesk text-[10px] font-bold text-white rotate-[-10deg] chip" style="background:${c}">${i+1}</div>
    <div class="w-16 h-16 mx-auto rounded-2xl flex items-center justify-center grotesk text-xl font-bold" style="background:linear-gradient(to bottom right, ${cLight}, ${c});color:${cText};box-shadow: inset 0 4px 8px rgba(255,255,255,0.5), 0 4px 0 rgba(0,0,0,0.12)">${init}</div>
    <div class="mt-3 grotesk font-bold text-[15px] leading-tight text-[#2E2716]">${name}</div>
    <div class="mt-2 inline-block text-[10px] grotesk font-bold uppercase tracking-widest px-3 py-1 rounded-full chip" style="background:${cLight};color:${cText}">${pts}</div>
  </div>`);
});
for (let i=0;i<3;i++) {
  grid.insertAdjacentHTML('beforeend', `
  <div class="relative px-3 py-6 text-center border-2 border-dashed border-[#CDBD98] bg-white/30" style="border-radius:18px">
    <div class="w-16 h-16 mx-auto rounded-2xl border-2 border-dashed border-[#CDBD98]"></div>
    <div class="mt-3 grotesk font-bold text-[11px] uppercase tracking-[0.25em] text-[#B3A382]">Free spot</div>
  </div>`);
}
</script>
</body>
</html>
