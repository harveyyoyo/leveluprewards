<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { width:1440px; height:900px; overflow:hidden; background:#FFF6E7; background-image: radial-gradient(rgba(40,36,30,0.07) 1.5px, transparent 1.5px); background-size: 18px 18px; }
  .grotesk { font-family:'Space Grotesk',sans-serif; }
  .dmsans { font-family:'DM Sans',sans-serif; }
  .panel { background:#FFFDF6; border:3px solid #26221B; border-radius:16px; box-shadow: 7px 7px 0 #26221B; }
  .btn3d { border:3px solid #26221B; border-radius:14px; box-shadow: 5px 5px 0 #26221B; transition: transform .1s ease, box-shadow .1s ease; }
  .btn3d:active { transform: translate(4px,4px); box-shadow: 1px 1px 0 #26221B; }
  .chip { border:2.5px solid #26221B; border-radius:9999px; box-shadow: 3px 3px 0 #26221B; }
  .bubble { position:relative; }
  .bubble:after { content:''; position:absolute; bottom:-16px; left:44px; width:0; height:0; border-left:14px solid transparent; border-right:14px solid transparent; border-top:16px solid #26221B; }
  .bubble:before { content:''; position:absolute; bottom:-10px; left:46.5px; width:0; height:0; border-left:11px solid transparent; border-right:11px solid transparent; border-top:13px solid #FFD57E; z-index:1; }
  .halftone { background-image: radial-gradient(rgba(38,34,27,0.16) 1.3px, transparent 1.3px); background-size: 9px 9px; }
</style>
</head>
<body class="dmsans text-[#26221B]">
<div class="flex h-full">

  <!-- SIDEBAR -->
  <aside class="w-[290px] shrink-0 flex flex-col px-5 pt-6 pb-5 border-r-3" style="border-right:3px solid #26221B">
    <div class="panel halftone px-5 py-5 mb-5">
      <div class="grotesk text-[24px] font-bold leading-tight">Control Panel!</div>
      <div class="mt-1 text-[11px] font-bold uppercase tracking-[0.25em] text-[#C43D2E]">ZAP — pick a power</div>
    </div>

    <div class="flex-1 space-y-6 overflow-hidden px-1">
      <button class="btn3d w-full py-4 bg-[#3D4E8D] text-white grotesk font-bold text-sm tracking-wide">💥 Arrange Seats</button>

      <div>
        <div class="flex items-center justify-between mb-3 px-1">
          <span class="grotesk font-bold text-[11px] uppercase tracking-[0.18em]">Add Points</span>
          <span class="text-[9px] font-bold uppercase tracking-widest bg-[#3BA57F] text-white px-2 py-1 rounded-full chip">+5 to class</span>
        </div>
        <div class="grid grid-cols-3 gap-3">
          <button class="btn3d py-3 bg-[#FFD57E] grotesk font-bold">+1</button>
          <button class="btn3d py-3 bg-[#FFAB95] grotesk font-bold">+5</button>
          <button class="btn3d py-3 bg-[#C9AEFF] grotesk font-bold">+10</button>
        </div>
      </div>

      <div class="space-y-4">
        <button class="btn3d w-full py-3.5 bg-[#FFDE76] grotesk font-bold text-sm text-left px-5">⚡ Random Student</button>
        <button class="btn3d w-full py-3.5 bg-[#C9AEFF] grotesk font-bold text-sm text-left px-5">🎟 Raffle Draw</button>
        <button class="btn3d w-full py-3.5 bg-[#FFAB95] grotesk font-bold text-sm text-left px-5">📋 Behavior Log</button>
        <button class="btn3d w-full py-3.5 bg-[#8FDCC0] grotesk font-bold text-sm text-left px-5">✅ Attendance Roll</button>
      </div>

      <div>
        <div class="grotesk font-bold text-[11px] uppercase tracking-[0.18em] mb-3 px-1">Group Timer</div>
        <div class="panel p-4 text-center">
          <div class="grotesk text-[38px] font-bold leading-none">15:00</div>
          <div class="flex gap-2 mt-3">
            <button class="btn3d flex-1 py-2.5 bg-[#8FDCC0] text-xs grotesk font-bold uppercase">Start</button>
            <button class="btn3d flex-1 py-2.5 bg-[#FFFDF6] text-xs grotesk font-bold uppercase">Reset</button>
          </div>
        </div>
      </div>
    </div>

    <button class="btn3d w-full py-3.5 mt-5 bg-[#FFFDF6] grotesk font-bold text-xs uppercase tracking-widest">Setup & More</button>
  </aside>

  <!-- CANVAS -->
  <main class="flex-1 flex flex-col">
    <header class="mx-8 mt-6 shrink-0 flex items-center justify-between px-2 pb-4" style="border-bottom:3px solid #26221B">
      <div class="flex items-center gap-5">
        <button class="btn3d px-4 py-2 bg-[#FFD57E] grotesk font-bold text-xs">Grade 5 ▾</button>
        <span class="text-[11px] font-bold uppercase tracking-[0.2em] flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full" style="background:#26221B"></span>12/22 present</span>
      </div>
      <div class="flex items-center gap-3">
        <button class="btn3d px-4 py-2 bg-[#3D4E8D] text-white text-[11px] grotesk font-bold">Projector</button>
        <button class="btn3d px-4 py-2 bg-[#3D4E8D] text-white text-[11px] grotesk font-bold">Shortcuts</button>
        <div class="w-9 h-9 rounded-full bg-[#F97F62] flex items-center justify-center text-[10px] grotesk font-bold text-white chip">TR</div>
      </div>
    </header>

    <div class="flex-1 relative overflow-auto px-10 pt-9 pb-10">
      <div class="flex justify-center mb-10">
        <div class="panel bg-[#FFD57E] px-12 py-4 text-center bubble">
          <div class="text-[9px] grotesk font-bold uppercase tracking-[0.35em]">Front of class</div>
          <div class="grotesk text-lg font-bold uppercase tracking-[0.18em]">Teacher Desk</div>
        </div>
      </div>
      <div id="grid" class="grid grid-cols-5 gap-x-7 gap-y-9 max-w-[1060px] mx-auto"></div>
    </div>
  </main>
</div>

<script>
const students = [
  ["JD","John Davis","87 PTS","POW!","#FFD57E","#8A5410"],
  ["EW","Emily Ward","1.2K PTS","ZAP!","#F97F62","#8A2A1E"],
  ["ZJ","Zoe Jenkins","462 PTS","WOW!","#8FDCC0","#1E6B4C"],
  ["LH","Leo Hayes","890 PTS","BAM!","#C9AEFF","#5B3A9E"],
  ["AB","Ava Brooks","2.1K PTS","BOOM!","#7FB8E8","#25598A"],
  ["KM","Kai Miller","66 PTS","POW!","#FFD57E","#8A5410"],
  ["SO","Sarah O'Neill","94 PTS","ZAP!","#F97F62","#8A2A1E"],
  ["RR","Ryan Reed","118 PTS","WOW!","#8FDCC0","#1E6B4C"],
  ["MP","Mia Park","2.4K PTS","BAM!","#C9AEFF","#5B3A9E"],
  ["TL","Toby Long","1.9K PTS","BOOM!","#7FB8E8","#25598A"]
];
const grid = document.getElementById('grid');
students.forEach(([init,name,pts,bang,c,cText]) => {
  grid.insertAdjacentHTML('beforeend', `
  <div class="panel relative px-3 py-6 text-center cursor-pointer hover:-translate-y-1 transition-transform">
    <div class="absolute -top-3.5 -right-2.5 px-2.5 py-1 grotesk text-[10px] font-bold text-white rotate-[8deg] chip" style="background:#C43D2E">${bang}</div>
    <div class="w-16 h-16 mx-auto rounded-xl flex items-center justify-center grotesk text-xl font-bold chip halftone" style="background:${c};color:${cText}">${init}</div>
    <div class="mt-3 grotesk font-bold text-[15px] leading-tight">${name}</div>
    <div class="mt-2.5 inline-block text-[10px] grotesk font-bold uppercase tracking-widest px-3 py-1 chip bg-[#FFFDF6]">${pts}</div>
  </div>`);
});
for (let i=0;i<3;i++) {
  grid.insertAdjacentHTML('beforeend', `
  <div class="relative px-3 py-6 text-center border-3 border-dashed border-[#B7AD98] bg-white/40" style="border:3px dashed #B7AD98; border-radius:16px">
    <div class="w-16 h-16 mx-auto rounded-xl" style="border:3px dashed #B7AD98"></div>
    <div class="mt-3 grotesk font-bold text-[11px] uppercase tracking-[0.25em] text-[#9A9080]">Empty panel</div>
  </div>`);
}
</script>
</body>
</html>
