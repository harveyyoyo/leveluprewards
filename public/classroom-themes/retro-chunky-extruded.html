<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style type="text/tailwindcss">
@theme {
  --color-canvas: hsl(38 25% 96%);
  --color-navy: hsl(222 47% 11%);
  --color-border-dark: hsl(222 47% 11% / 0.15);
  --color-student-red: #ef4444;
  --color-student-teal: #14b8a6;
  --color-student-yellow: #f59e0b;
  --color-student-purple: #8b5cf6;
  --ease-retro: cubic-bezier(0.34, 1.56, 0.64, 1);
}
</style>
<style>
  .retro-extrude {
    box-shadow: 0px 4px 0px 0px rgba(0,0,0,0.2);
    transition: all 0.15s var(--ease-retro);
  }
  .retro-extrude:hover {
    transform: translateY(-2px);
    box-shadow: 0px 6px 0px 0px rgba(0,0,0,0.25);
  }
  .retro-extrude:active {
    transform: translateY(2px);
    box-shadow: 0px 1px 0px 0px rgba(0,0,0,0.2);
  }
  .canvas-dots {
    background-image: radial-gradient(circle, #00000010 1.5px, transparent 1.5px);
    background-size: 24px 24px;
  }
</style>
<script id="dark-mode-detector">
try {
  if (new URLSearchParams(window.location.search).get('dark') === '1') {
    document.documentElement.style.filter = 'invert(0.92) hue-rotate(180deg)';
    document.documentElement.style.background = '#111114';
  }
} catch (e) {}
</script>
</head>
<body>
<div class="flex h-screen w-full flex-col bg-canvas font-['DM_Sans'] text-navy">
  <header class="flex h-14 items-center justify-between bg-navy px-4 text-white">
    <div class="flex items-center gap-4">
      <div class="flex items-center gap-2 rounded-lg bg-white/10 px-3 py-1.5 ring-1 ring-white/20">
        <span class="font-['Space_Grotesk'] text-sm font-bold uppercase tracking-wider">Grade 5</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <div class="h-2 w-2 animate-pulse rounded-full bg-emerald-400"></div>
        <span class="font-bold uppercase tracking-tighter">3/22 Here • Manual</span>
      </div>
      <div class="rounded-full border border-white/20 px-3 py-1 text-[10px] font-bold uppercase tracking-widest bg-emerald-900/30">
        Hall: All Clear
      </div>
    </div>
    <div class="flex items-center gap-3">
      <div class="flex items-center gap-1.5 rounded-full bg-student-yellow px-3 py-1 text-navy">
        <span class="font-['Space_Grotesk'] text-xs font-bold">+15 pts</span>
      </div>
      <nav class="flex gap-1">
        <button class="h-9 px-3 text-[11px] font-bold uppercase tracking-widest hover:bg-white/10 rounded-md transition-colors">Projector</button>
        <button class="h-9 px-3 text-[11px] font-bold uppercase tracking-widest hover:bg-white/10 rounded-md transition-colors">Cheatsheet</button>
        <button class="h-9 px-3 text-[11px] font-bold uppercase tracking-widest hover:bg-white/10 rounded-md transition-colors">Shortcuts</button>
      </nav>
    </div>
  </header>
  <div class="flex flex-1 overflow-hidden">
    <aside class="w-64 flex-col gap-4 overflow-y-auto border-r border-border-dark bg-white/50 p-4">
      <button class="retro-extrude mb-6 flex w-full items-center justify-center rounded-xl bg-student-yellow py-3 font-['Space_Grotesk'] text-sm font-bold uppercase tracking-wider">
        Arrange Seats
      </button>
      <div class="mb-6 space-y-2">
        <div class="flex items-center justify-between px-1">
          <span class="text-[10px] font-bold uppercase tracking-widest text-navy/50">Class Reward</span>
          <span class="font-['Space_Grotesk'] text-xs text-student-teal">+5 pts</span>
        </div>
        <div class="grid grid-cols-3 gap-2">
          <button class="retro-extrude flex h-10 items-center justify-center rounded-lg bg-white ring-1 ring-black/5 text-xs font-bold">+1</button>
          <button class="retro-extrude flex h-10 items-center justify-center rounded-lg bg-white ring-1 ring-black/5 text-xs font-bold">+2</button>
          <button class="retro-extrude flex h-10 items-center justify-center rounded-lg bg-student-teal text-white text-xs font-bold">+5</button>
          <button class="retro-extrude flex h-10 items-center justify-center rounded-lg bg-white ring-1 ring-black/5 text-xs font-bold text-navy/40">+10</button>
          <button class="retro-extrude flex h-10 items-center justify-center rounded-lg bg-white ring-1 ring-black/5 text-xs font-bold text-navy/40">+15</button>
          <button class="retro-extrude flex h-10 items-center justify-center rounded-lg bg-white ring-1 ring-black/5 text-xs font-bold text-navy/40">+20</button>
        </div>
      </div>
      <div class="space-y-3">
        <button class="retro-extrude flex w-full items-center gap-3 rounded-xl bg-sky-500 px-4 py-3 text-left text-white">
          <span class="text-xs font-bold uppercase tracking-wide">Random student</span>
        </button>
        <button class="retro-extrude flex w-full items-center gap-3 rounded-xl bg-indigo-500 px-4 py-3 text-left text-white">
          <span class="text-xs font-bold uppercase tracking-wide">Raffle</span>
        </button>
        <button class="retro-extrude flex w-full items-center gap-3 rounded-xl bg-rose-500 px-4 py-3 text-left text-white">
          <span class="text-xs font-bold uppercase tracking-wide">Behavior Log</span>
        </button>
        <div class="pt-4 space-y-2">
          <div class="rounded-2xl border-2 border-dashed border-navy/10 p-4">
             <div class="mb-3 flex items-center justify-between">
               <span class="text-[10px] font-bold uppercase tracking-widest text-navy/60">Group Timer</span>
               <span class="font-['Space_Grotesk'] text-lg text-navy">08:00</span>
             </div>
             <div class="flex gap-2">
               <button class="retro-extrude flex-1 rounded-lg bg-emerald-500 py-2 text-[10px] font-bold uppercase text-white">Start</button>
               <button class="flex-1 rounded-lg border border-navy/10 py-2 text-[10px] font-bold uppercase text-navy/40">Reset</button>
             </div>
          </div>
        </div>
      </div>
    </aside>
    <main class="canvas-dots relative flex-1 overflow-y-auto p-8">
      <div class="mx-auto mb-12 flex w-fit flex-col items-center">
        <div class="retro-extrude flex items-center gap-4 rounded-2xl bg-navy px-8 py-3 text-white ring-4 ring-white">
          <div class="flex flex-col items-center leading-tight">
            <span class="font-['Space_Grotesk'] text-xs font-bold uppercase tracking-[0.2em]">Teacher Desk</span>
            <span class="text-[10px] text-white/50">Front of classroom</span>
          </div>
        </div>
      </div>
      <div class="mx-auto grid max-w-6xl grid-cols-5 gap-6" id="desk-grid"></div>
    </main>
  </div>
</div>
<script>
const students = [
  ["JD","John Doe","87 pts","red"],["EW","Emily W.","1,042 pts","teal"],["ZJ","Zoe James","688 pts","yellow"],
  ["JH","J. Hwan","1,817 pts","purple"],["EH","Ethan H.","529 pts","red"],["JB","James B.","99 pts","teal"],
  ["EV","Evelyn","938 pts","purple"],["ET","Ethan","2,125 pts","yellow"],["JW","Joseph","780 pts","red"],
  ["LN","Logan","1,506 pts","yellow"],["AL","Addison","2,020 pts","teal"],["MM","Mia","1,687 pts","red"],
  ["MG","Michael","376 pts","teal"],["AR","Aiden","1,523 pts","purple"],["MD","Madison","2,106 pts","teal"],
  ["OJ","Owen","1,689 pts","red"],["AY","Aria","1,882 pts","yellow"],["IB","Isabella","548 pts","teal"],
  ["PM","Penelope","1,724 pts","purple"],["WA","William","1,379 pts","teal"],["DA","David","132 pts","purple"]
];
const grid = document.getElementById('desk-grid');
students.forEach(([init,name,pts,c]) => {
  const textCls = c === 'yellow' ? 'text-navy' : 'text-white';
  grid.insertAdjacentHTML('beforeend', `
    <div class="retro-extrude flex flex-col items-center gap-3 rounded-2xl border-b-8 border-student-${c}/30 bg-white p-5 ring-1 ring-black/5">
      <div class="flex size-14 items-center justify-center rounded-full bg-student-${c} font-['Space_Grotesk'] text-lg font-bold ${textCls} shadow-lg">${init}</div>
      <div class="text-center">
         <h3 class="font-['Space_Grotesk'] text-sm font-bold uppercase tracking-tight">${name}</h3>
         <div class="mt-2 inline-flex rounded-full bg-navy px-3 py-1 text-[10px] font-bold text-white">${pts}</div>
      </div>
    </div>`);
});
</script>
</body>
</html>
