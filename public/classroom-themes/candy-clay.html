<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { width:1440px; height:900px; overflow:hidden; background:#FFF4E4; }
  .grotesk { font-family:'Space Grotesk',sans-serif; }
  .dmsans { font-family:'DM Sans',sans-serif; }
  /* clay pod: bottom thickness + soft drop + top-left gloss */
  .clay { border-radius:26px; box-shadow: 0 14px 0 rgba(0,0,0,0.10), 0 22px 34px rgba(90,60,20,0.18), inset 0 10px 14px rgba(255,255,255,0.65), inset 0 -8px 12px rgba(0,0,0,0.06); }
  .clay-sm { border-radius:18px; box-shadow: 0 8px 0 rgba(0,0,0,0.10), 0 12px 20px rgba(90,60,20,0.16), inset 0 6px 10px rgba(255,255,255,0.6), inset 0 -5px 8px rgba(0,0,0,0.05); }
  .clay-btn { border-radius:9999px; box-shadow: 0 7px 0 rgba(0,0,0,0.13), 0 10px 16px rgba(90,60,20,0.18), inset 0 5px 8px rgba(255,255,255,0.55), inset 0 -4px 6px rgba(0,0,0,0.07); transition: transform .12s ease, box-shadow .12s ease; }
  .clay-btn:active { transform: translateY(5px) scale(.98); box-shadow: 0 2px 0 rgba(0,0,0,0.13), 0 4px 8px rgba(90,60,20,0.18), inset 0 5px 8px rgba(255,255,255,0.55); }
  .clay-dot { border-radius:9999px; box-shadow: inset 0 6px 10px rgba(255,255,255,0.7), inset 0 -6px 10px rgba(0,0,0,0.10), 0 6px 10px rgba(90,60,20,0.15); }
  .blob { position:absolute; border-radius:9999px; filter: blur(2px); opacity:.55; pointer-events:none; }
</style>
<script id="dark-mode-detector">
try {
  if (new URLSearchParams(window.location.search).get('dark') === '1') {
    document.documentElement.style.filter = 'invert(0.92) hue-rotate(180deg)';
    document.documentElement.style.background = '#111114';
  }
} catch (e) {}
</script>
</head>
<body class="dmsans text-[#4A3B2A]">
<div class="relative flex h-full">

  <div class="blob w-[420px] h-[420px] -left-24 -top-24" style="background:radial-gradient(circle at 35% 35%, #FFD9C7, #FFB99A)"></div>
  <div class="blob w-[360px] h-[360px] -right-20 -bottom-24" style="background:radial-gradient(circle at 35% 35%, #CFF1E4, #A8E4CE)"></div>

  <!-- SIDEBAR : clay tray -->
  <aside class="w-[290px] shrink-0 flex flex-col relative z-10 px-5 pt-6 pb-5">
    <div class="clay bg-[#FFFDF7] px-5 py-5 mb-5">
      <div class="grotesk text-[24px] font-bold leading-tight text-[#3E2E1E]">Classroom Tools</div>
      <div class="mt-1 text-[11px] font-bold uppercase tracking-[0.2em] text-[#C08A4E]">squish to use</div>
    </div>

    <div class="flex-1 space-y-6 overflow-hidden px-1">
      <button class="clay-btn w-full py-4 bg-gradient-to-b from-[#3D4E8D] to-[#2E3B6E] text-white grotesk font-bold text-sm tracking-wide">Arrange Seats</button>

      <div>
        <div class="flex items-center justify-between mb-3 px-1">
          <span class="grotesk font-bold text-[11px] uppercase tracking-[0.18em] text-[#7A6448]">Add Points</span>
          <span class="text-[9px] font-bold uppercase tracking-widest bg-[#7AC7A3] text-white px-2 py-1 rounded-full">+5 to class</span>
        </div>
        <div class="grid grid-cols-3 gap-3">
          <button class="clay-btn py-3 bg-gradient-to-b from-[#FFE9B8] to-[#FFD57E] text-[#7A5410] grotesk font-bold">+1</button>
          <button class="clay-btn py-3 bg-gradient-to-b from-[#FFD1C4] to-[#FFAB95] text-[#8A3A22] grotesk font-bold">+5</button>
          <button class="clay-btn py-3 bg-gradient-to-b from-[#E3D5FF] to-[#C9AEFF] text-[#5B3A9E] grotesk font-bold">+10</button>
        </div>
      </div>

      <div class="space-y-3">
        <button class="clay-btn w-full py-3.5 bg-gradient-to-b from-[#FFDE76] to-[#FFC53D] text-[#6E4E08] grotesk font-bold text-sm text-left px-5">🍌 Random Student</button>
        <button class="clay-btn w-full py-3.5 bg-gradient-to-b from-[#C9AEFF] to-[#A882F2] text-white grotesk font-bold text-sm text-left px-5">🎲 Raffle Draw</button>
        <button class="clay-btn w-full py-3.5 bg-gradient-to-b from-[#FFAB95] to-[#F97F62] text-white grotesk font-bold text-sm text-left px-5">📋 Behavior Log</button>
        <button class="clay-btn w-full py-3.5 bg-gradient-to-b from-[#8FDCC0] to-[#5FC4A0] text-white grotesk font-bold text-sm text-left px-5">✅ Attendance Roll</button>
      </div>

      <div>
        <div class="grotesk font-bold text-[11px] uppercase tracking-[0.18em] text-[#7A6448] mb-3 px-1">Group Timer</div>
        <div class="clay bg-[#FFFDF7] p-4 text-center">
          <div class="grotesk text-[40px] font-bold text-[#3E2E1E] leading-none">15:00</div>
          <div class="flex gap-2 mt-3">
            <button class="clay-btn flex-1 py-2.5 bg-gradient-to-b from-[#8FDCC0] to-[#5FC4A0] text-white text-xs grotesk font-bold uppercase">Start</button>
            <button class="clay-btn flex-1 py-2.5 bg-gradient-to-b from-[#F1E7D8] to-[#E2D3BC] text-[#7A6448] text-xs grotesk font-bold uppercase">Reset</button>
          </div>
        </div>
      </div>
    </div>

    <button class="clay-btn w-full py-3.5 mt-5 bg-gradient-to-b from-[#FFFDF7] to-[#F3EADB] text-[#7A6448] grotesk font-bold text-xs uppercase tracking-widest">Setup & More</button>
  </aside>

  <!-- CANVAS -->
  <main class="flex-1 flex flex-col relative z-10">
    <!-- floating header -->
    <header class="mx-8 mt-6 shrink-0 clay bg-[#3E3264] text-white flex items-center justify-between px-7 py-4">
      <div class="flex items-center gap-5">
        <button class="clay-btn px-4 py-2 bg-gradient-to-b from-[#FFDE76] to-[#FFC53D] text-[#6E4E08] grotesk font-bold text-xs">Grade 5 ▾</button>
        <span class="text-[11px] font-bold uppercase tracking-[0.2em] flex items-center gap-2 text-white/90"><span class="w-2.5 h-2.5 rounded-full bg-[#7BE3AE] clay-dot"></span>12/22 present</span>
      </div>
      <div class="flex items-center gap-3">
        <button class="clay-btn px-4 py-2 bg-gradient-to-b from-[#6A5A9E] to-[#55468A] text-white text-[11px] grotesk font-bold">Projector</button>
        <button class="clay-btn px-4 py-2 bg-gradient-to-b from-[#6A5A9E] to-[#55468A] text-white text-[11px] grotesk font-bold">Shortcuts</button>
        <div class="w-9 h-9 rounded-full clay-dot bg-gradient-to-b from-[#FFAB95] to-[#F97F62] flex items-center justify-center text-[10px] grotesk font-bold text-white">TR</div>
      </div>
    </header>

    <!-- seating canvas -->
    <div class="flex-1 relative overflow-auto px-10 pt-8 pb-10">
      <!-- teacher desk -->
      <div class="flex justify-center mb-9">
        <div class="clay bg-gradient-to-b from-[#FFFDF7] to-[#F6ECDD] px-12 py-4 text-center">
          <div class="text-[9px] grotesk font-bold uppercase tracking-[0.35em] text-[#C08A4E]">Front of class</div>
          <div class="grotesk text-lg font-bold uppercase tracking-[0.18em] text-[#3E2E1E]">Teacher Desk</div>
        </div>
      </div>
      <div id="grid" class="grid grid-cols-5 gap-x-6 gap-y-8 max-w-[1060px] mx-auto"></div>
    </div>
  </main>
</div>

<script>
const students = [
  ["JD","John Davis","87 PTS","#FFD57E","#FFE9B8","#7A5410"],
  ["EW","Emily Ward","1.2K PTS","#F97F62","#FFD1C4","#8A3A22"],
  ["ZJ","Zoe Jenkins","462 PTS","#7AC7A3","#B8EBD4","#1E6B4C"],
  ["LH","Leo Hayes","890 PTS","#A882F2","#E3D5FF","#5B3A9E"],
  ["AB","Ava Brooks","2.1K PTS","#7FB8E8","#C4E2F8","#25598A"],
  ["KM","Kai Miller","66 PTS","#FFD57E","#FFE9B8","#7A5410"],
  ["SO","Sarah O'Neill","94 PTS","#F97F62","#FFD1C4","#8A3A22"],
  ["RR","Ryan Reed","118 PTS","#7AC7A3","#B8EBD4","#1E6B4C"],
  ["MP","Mia Park","2.4K PTS","#A882F2","#E3D5FF","#5B3A9E"],
  ["TL","Toby Long","1.9K PTS","#7FB8E8","#C4E2F8","#25598A"]
];
const grid = document.getElementById('grid');
students.forEach(([init,name,pts,c,cLight,cText]) => {
  grid.insertAdjacentHTML('beforeend', `
  <div class="clay relative px-3 py-6 text-center cursor-pointer hover:-translate-y-1.5 transition-transform" style="background:linear-gradient(to bottom, #FFFDF7, ${cLight})">
    <div class="w-16 h-16 mx-auto rounded-full flex items-center justify-center grotesk text-xl font-bold clay-dot" style="background:linear-gradient(to bottom right, ${cLight}, ${c});color:${cText}">${init}</div>
    <div class="mt-3 grotesk font-bold text-[15px] leading-tight text-[#3E2E1E]">${name}</div>
    <div class="mt-2 inline-block text-[10px] grotesk font-bold uppercase tracking-widest px-3 py-1 rounded-full clay-dot" style="background:${c};color:${cText}">${pts}</div>
  </div>`);
});
for (let i=0;i<3;i++) {
  grid.insertAdjacentHTML('beforeend', `
  <div class="relative px-3 py-6 text-center border-[3px] border-dashed border-[#D9C6A8] bg-white/30" style="border-radius:26px">
    <div class="w-16 h-16 mx-auto rounded-full border-[3px] border-dashed border-[#D9C6A8]"></div>
    <div class="mt-3 grotesk font-bold text-[11px] uppercase tracking-[0.25em] text-[#B49B77]">Empty desk</div>
  </div>`);
}
</script>
</body>
</html>
