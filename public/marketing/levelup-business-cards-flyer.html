<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>LevelUp Rewards — Business Cards</title>
    <!-- Modern typography matching other high-fidelity flyers -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700;800&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet" />
    <!-- Local QR Code generation library to bypass CSP domain block policies -->
    <script src="qrcode.min.js"></script>
    <style>
      @page {
        size: letter;
        margin: 0;
      }

      :root {
        --bg: #0b1220;
        --panel: rgba(255, 255, 255, 0.05);
        --text: #eaf0ff;
        --muted: rgba(234, 240, 255, 0.78);
        --hair: rgba(234, 240, 255, 0.15);
        --accent: #7c3aed;
        --accent2: #06b6d4;
        --success: #22c55e;
        --black: #0a0a0a;
        --strong: #ffffff;
        --heading-color: var(--accent2);
        --featured-border: var(--accent2);
        --featured-bg: rgba(255, 255, 255, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
        color: var(--text);
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      /* SCREEN STYLES */
      @media screen {
        body {
          background-color: #03060f;
          display: flex !important;
          flex-direction: row !important;
          align-items: stretch !important;
          justify-content: flex-start !important;
          min-height: 100vh;
          margin: 0;
          padding: 0;
          overflow: hidden;
        }

        .control-sidebar {
          width: 330px;
          min-width: 330px;
          background: #090e1a;
          border-right: 1px solid rgba(255, 255, 255, 0.08);
          padding: 24px 20px;
          display: flex;
          flex-direction: column;
          gap: 20px;
          height: 100vh;
          overflow-y: auto;
          color: #eaf0ff;
          box-sizing: border-box;
          font-size: 13px;
        }

        .sidebar-header {
          display: flex;
          align-items: center;
          gap: 12px;
          border-bottom: 1px solid rgba(255, 255, 255, 0.1);
          padding-bottom: 16px;
        }

        .sidebar-logo {
          font-size: 24px;
        }

        .sidebar-title-text h2 {
          font-size: 16px !important;
          font-weight: 800;
          color: #fff !important;
          margin: 0 !important;
          letter-spacing: -0.01em;
        }

        .sidebar-subtitle-text {
          font-size: 11px;
          color: rgba(234, 240, 255, 0.5);
          margin-top: 2px;
        }

        .sidebar-section {
          display: flex;
          flex-direction: column;
          gap: 8px;
          border-bottom: 1px solid rgba(255, 255, 255, 0.06);
          padding-bottom: 16px;
        }

        .sidebar-label {
          font-size: 10px;
          text-transform: uppercase;
          letter-spacing: 0.05em;
          color: rgba(234, 240, 255, 0.5);
          font-weight: 700;
        }

        .sidebar-input, .sidebar-select {
          background: rgba(255, 255, 255, 0.05);
          border: 1px solid rgba(255, 255, 255, 0.12);
          border-radius: 8px;
          padding: 8px 12px;
          color: #fff;
          font-family: inherit;
          font-size: 12.5px;
          width: 100%;
          outline: none;
          box-sizing: border-box;
        }

        .sidebar-select option {
          background-color: #090e1a;
          color: #ffffff;
        }

        .sidebar-input:focus, .sidebar-select:focus {
          border-color: var(--accent2);
          box-shadow: 0 0 0 2px rgba(6, 182, 212, 0.2);
        }

        .sidebar-btn {
          background: linear-gradient(135deg, var(--accent), var(--accent2));
          color: #fff;
          border: none;
          padding: 12px;
          border-radius: 8px;
          font-weight: 700;
          font-size: 13px;
          cursor: pointer;
          transition: all 0.2s ease;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 8px;
          text-shadow: 0 1px 2px rgba(0,0,0,0.2);
          box-shadow: 0 4px 12px rgba(6, 182, 212, 0.15);
          width: 100%;
        }

        .sidebar-btn:hover {
          filter: brightness(1.1);
          transform: translateY(-1px);
          box-shadow: 0 6px 16px rgba(6, 182, 212, 0.25);
        }

        .sidebar-btn:active {
          transform: translateY(0);
        }

        .proposal-main {
          flex: 1;
          height: 100vh;
          overflow-y: auto;
          display: flex;
          flex-direction: column;
          align-items: center;
          padding: 40px 20px;
          gap: 32px;
          box-sizing: border-box;
          background-image: 
            radial-gradient(at 0% 0%, rgba(124, 58, 237, 0.1) 0px, transparent 50%),
            radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.08) 0px, transparent 50%);
        }

        .page {
          border-radius: 0;
          box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.7), 0 0 50px rgba(99, 102, 241, 0.1);
          transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
      }

      /* PRINT STYLES */
      @media print {
        .no-print {
          display: none !important;
        }
        body {
          background: transparent !important;
          padding: 0 !important;
          margin: 0 !important;
          display: block !important;
        }
        .page {
          margin: 0 !important;
          border: none !important;
          box-shadow: none !important;
          page-break-after: always;
        }
        .bcard-container {
          outline: none !important;
        }
      }

      /* BUSINESS CARD SHEET GRID */
      .page {
        width: 8.5in;
        height: 11in;
        background: #ffffff;
        padding: 0.5in 0.75in;
        display: grid;
        grid-template-columns: 3.5in 3.5in;
        grid-template-rows: repeat(5, 2in);
        gap: 0;
      }

      .bcard-container {
        width: 3.5in;
        height: 2in;
        outline: 1px dashed rgba(0,0,0,0.1); /* Cut lines for screen preview */
        position: relative;
        overflow: hidden;
      }

      /* ==========================================================================
         CANONICAL STUDENT ID CARD STYLE
         ========================================================================== */
      .print-id-card {
        width: 100%;
        height: 100%;
        padding: 10px 14px;
        background: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
        align-items: stretch;
        justify-content: space-between;
        position: relative;
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid var(--hair);
      }

      .print-id-card.design-premium {
        padding: 12px 15px 10px;
        border-radius: 16px;
        background:
          linear-gradient(115deg, rgba(255, 255, 255, 0.12) 0 18%, transparent 18% 100%),
          radial-gradient(circle at 82% 18%, color-mix(in srgb, var(--accent2) 30%, transparent), transparent 44%),
          linear-gradient(135deg, color-mix(in srgb, var(--bg) 88%, var(--accent) 12%), var(--bg));
      }

      .print-id-card.design-premium::before {
        content: "";
        position: absolute;
        top: 58px;
        left: 15px;
        width: 30px;
        height: 22px;
        border-radius: 5px;
        background:
          linear-gradient(90deg, transparent 45%, rgba(15, 23, 42, 0.22) 45% 55%, transparent 55%),
          linear-gradient(180deg, #fde68a, #d97706);
        box-shadow: inset 0 0 0 1px rgba(15, 23, 42, 0.24);
        opacity: 0.9;
      }

      .print-id-card.design-premium .print-id-main {
        padding-left: 44px;
      }

      .print-id-card.design-diagonal {
        border-radius: 4px;
        background:
          linear-gradient(130deg, color-mix(in srgb, var(--accent) 28%, transparent) 0 38%, transparent 38% 100%),
          linear-gradient(130deg, transparent 0 66%, color-mix(in srgb, var(--accent2) 34%, transparent) 66% 100%),
          var(--bg);
      }

      .print-id-card.design-diagonal .print-id-header-container {
        border-bottom: 0;
      }

      .print-id-card.design-diagonal .print-id-avatar {
        border-radius: 50%;
      }

      .print-id-card.design-clean {
        border-radius: 10px;
        background:
          linear-gradient(90deg, color-mix(in srgb, var(--accent2) 26%, transparent) 0 4px, transparent 4px),
          var(--bg);
      }

      .print-id-card.design-clean .bc-decor,
      .print-id-card.design-clean .bc-decor2 {
        display: none;
      }

      .print-id-card.design-clean .print-id-header-container {
        border-bottom-style: dashed;
      }

      .print-id-card.design-clean .print-id-avatar {
        width: 42px;
        height: 42px;
        border-radius: 8px;
      }

      .print-id-card.design-arcade {
        border-radius: 14px;
        background:
          linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
          linear-gradient(180deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
          radial-gradient(circle at 18% 20%, color-mix(in srgb, var(--accent) 36%, transparent), transparent 35%),
          radial-gradient(circle at 90% 80%, color-mix(in srgb, var(--accent2) 35%, transparent), transparent 40%),
          var(--bg);
        background-size: 14px 14px, 14px 14px, auto, auto, auto;
      }

      .print-id-card.design-arcade .print-id-header {
        box-shadow: 0 0 16px color-mix(in srgb, var(--accent2) 40%, transparent);
      }

      .print-id-card.design-arcade .print-id-avatar {
        border-radius: 14px;
        box-shadow: 0 0 20px color-mix(in srgb, var(--accent) 22%, transparent);
      }

      .print-id-card.design-school-card {
        padding: 10px 12px;
        border-radius: 7px;
        border: 1px solid #d8c7a4 !important;
        background: #f3ebdc !important;
        color: #111827 !important;
        box-shadow: none;
      }

      .print-id-card.design-school-card .bc-decor,
      .print-id-card.design-school-card .bc-decor2 {
        display: none;
      }

      .print-id-card.design-school-card .print-id-header-container {
        align-items: flex-start;
        padding-bottom: 5px;
        margin-bottom: 0;
        border-bottom: 1px solid #d7c8aa;
      }

      .print-id-card.design-school-card .print-id-app {
        gap: 5px;
      }

      .print-id-card.design-school-card .print-id-app-logo {
        width: 17px;
        height: 17px;
        padding: 2px;
        border-radius: 2px;
        background: #fffaf0;
        border: 1px solid #d7c8aa;
      }

      .print-id-card.design-school-card .print-id-app-name {
        color: #111827 !important;
        font-size: 8px;
        line-height: 1;
      }

      .print-id-card.design-school-card .print-id-app-tagline {
        color: #475569 !important;
        font-size: 6px;
        line-height: 1.05;
      }

      .print-id-card.design-school-card .print-id-school .print-id-header {
        padding: 0;
        border: 0;
        border-radius: 0;
        background: transparent;
        color: #111827 !important;
        font-size: 7px;
        letter-spacing: 0;
        text-transform: none;
      }

      .print-id-card.design-school-card .print-id-main {
        flex: 1;
        align-items: center;
        padding: 0 0 0 86px;
        min-height: 80px;
      }

      .print-id-card.design-school-card .print-id-left {
        gap: 0;
      }

      .print-id-card.design-school-card .print-id-avatar {
        display: none;
      }

      .print-id-card.design-school-card .print-id-text {
        justify-content: center;
      }

      .print-id-card.design-school-card .print-id-name {
        color: #111827 !important;
        font-size: 13px;
        letter-spacing: -0.01em;
      }

      .print-id-card.design-school-card .print-id-class {
        margin-top: 2px;
        color: #111827 !important;
        font-size: 8px;
        font-weight: 800;
        letter-spacing: 0;
        text-transform: none;
      }

      .print-id-card.design-school-card .print-id-meta-info {
        display: none !important;
      }

      .print-id-card.design-school-card .print-id-barcode-container {
        position: absolute;
        left: 18px;
        top: 68px;
        width: 58px;
        padding: 0;
        margin: 0;
        border-top: 0;
        justify-content: flex-start;
      }

      .print-id-card.design-school-card .bc-qrcode-container {
        width: 58px !important;
        height: 58px !important;
        padding: 4px;
        border: 0 !important;
        border-radius: 4px;
        background: #ffffff !important;
        box-shadow: 0 0 0 1px rgba(17, 24, 39, 0.08);
      }

      .bc-decor {
        position: absolute;
        bottom: -20px;
        right: -20px;
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
        opacity: 0.15;
        pointer-events: none;
      }
      
      .bc-decor2 {
        position: absolute;
        top: -15px;
        left: 40%;
        width: 70px;
        height: 70px;
        border-radius: 50%;
        background: radial-gradient(circle, var(--accent2) 0%, transparent 70%);
        opacity: 0.12;
        pointer-events: none;
      }

      .print-id-header-container {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--hair);
        padding-bottom: 4px;
        margin-bottom: 4px;
        z-index: 1;
      }

      .print-id-app {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .print-id-app-logo {
        width: 18px;
        height: 18px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .print-id-app-logo img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }

      .print-id-app-text {
        display: flex;
        flex-direction: column;
        text-align: left;
      }

      .print-id-app-name {
        font-family: 'Outfit', sans-serif;
        font-size: 9px;
        font-weight: 800;
        line-height: 1.1;
        color: var(--strong);
      }

      .print-id-app-tagline {
        font-size: 7px;
        font-weight: 600;
        opacity: 0.85;
        line-height: 1.1;
        color: var(--heading-color);
      }

      .print-id-school .print-id-header {
        font-family: 'Outfit', sans-serif;
        font-size: 8px;
        font-weight: 800;
        color: var(--strong);
        background: var(--panel);
        border: 1px solid var(--hair);
        padding: 2px 6px;
        border-radius: 999px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .print-id-main {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 2px 0;
        z-index: 1;
      }

      .print-id-left {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: 1;
        min-width: 0;
      }

      .print-id-avatar {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        border: 1px solid var(--hair);
        background:
          radial-gradient(circle at 30% 20%, color-mix(in srgb, var(--accent2) 25%, transparent), transparent 55%),
          var(--panel);
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        position: relative;
      }

      .print-id-avatar img {
        width: 68%;
        height: 68%;
        object-fit: contain;
        display: block;
      }

      /* Logo fallback styled like the LevelUp app mark */
      .bc-avatar-fallback {
        position: absolute;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        font-family: 'Outfit', sans-serif;
        font-size: 11px;
        font-weight: 800;
        color: #ffffff;
        background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
        opacity: 0.95;
        text-shadow: 0 1px 2px rgba(0,0,0,0.25);
      }

      .print-id-text {
        display: flex;
        flex-direction: column;
        text-align: left;
        min-width: 0;
        flex: 1;
      }

      .print-id-name {
        font-family: 'Outfit', sans-serif;
        font-weight: 800;
        font-size: 13px;
        line-height: 1.1;
        color: var(--strong);
      }

      .print-id-class {
        font-size: 8px;
        font-weight: 700;
        color: var(--heading-color);
        text-transform: uppercase;
        margin-top: 1px;
      }

      .print-id-barcode-container {
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        border-top: 1px solid var(--hair);
        padding-top: 4px;
        margin-top: 4px;
        z-index: 1;
      }

      /* ==========================================================================
         CANONICAL COUPON STYLE
         ========================================================================== */
      .coupon-scalable {
        width: calc(100% - 16px);
        height: calc(100% - 16px);
        margin: 8px;
        padding: 9px 12px;
        background:
          linear-gradient(90deg, rgba(14, 165, 233, 0.08) 0 18%, transparent 18% 100%),
          repeating-linear-gradient(135deg, rgba(15, 23, 42, 0.035) 0 5px, transparent 5px 10px),
          #ffffff !important;
        color: #1e293b !important; /* Dark text for high contrast print */
        display: flex;
        flex-direction: column;
        align-items: stretch;
        justify-content: space-between;
        position: relative;
        border-radius: 10px;
        overflow: visible;
        border: 2px dashed var(--accent2) !important;
        box-shadow:
          0 0 0 1px rgba(15, 23, 42, 0.08),
          inset 0 0 0 3px #ffffff,
          inset 0 0 0 4px rgba(15, 23, 42, 0.1);
        font-family: 'DM Sans', sans-serif;
      }

      .coupon-scalable::before,
      .coupon-scalable::after {
        content: "";
        position: absolute;
        top: 50%;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: var(--bg);
        border: 1px solid rgba(15, 23, 42, 0.12);
        transform: translateY(-50%);
        z-index: 2;
      }

      .coupon-scalable::before {
        left: -10px;
      }

      .coupon-scalable::after {
        right: -10px;
      }

      .coupon-title {
        font-family: 'Outfit', sans-serif;
        font-size: 8px;
        font-weight: 800;
        text-transform: uppercase;
        color: #0f172a !important;
        letter-spacing: 0.08em;
        border-bottom: 1px dashed rgba(15, 23, 42, 0.22) !important;
        padding-bottom: 5px;
        margin-bottom: 5px;
        text-align: center;
        line-height: 1.2;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
      }

      .coupon-title img {
        width: 15px;
        height: 15px;
        object-fit: contain;
        flex-shrink: 0;
      }

      .coupon-main {
        display: flex;
        align-items: center;
        gap: 8px;
        border-bottom: 1px dashed rgba(15, 23, 42, 0.22) !important;
        padding-bottom: 5px;
        margin-bottom: 5px;
        flex: 1;
      }

      .coupon-left-badge {
        background: var(--accent2) !important;
        border: 1px solid color-mix(in srgb, var(--accent2) 75%, #0f172a 25%) !important;
        color: #ffffff !important;
        padding: 5px 6px;
        border-radius: 6px;
        font-weight: 800;
        font-size: 8px;
        text-transform: uppercase;
        min-width: 48px;
        text-align: center;
        letter-spacing: 0.05em;
        line-height: 1.2;
        box-shadow: 0 4px 10px rgba(15, 23, 42, 0.16);
      }

      .coupon-details-text {
        text-align: left;
        flex: 1;
        min-width: 0;
      }

      .coupon-name {
        font-family: 'Outfit', sans-serif;
        font-size: 12.5px;
        font-weight: 800;
        color: #0f172a !important;
        line-height: 1.1;
      }

      .coupon-category {
        font-size: 8px;
        font-weight: 700;
        color: var(--accent) !important;
        text-transform: uppercase;
        margin-top: 1px;
      }

      .coupon-barcode-zone {
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .coupon-redemption-label {
        flex: 1;
        font-size: 7px;
        font-weight: 700;
        color: #64748b !important;
        text-align: left;
        line-height: 1.2;
      }

      /* QR code container inside cards */
      .bc-qrcode-container {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff !important;
        border: 1px solid rgba(0, 0, 0, 0.12) !important;
        border-radius: 4px;
        padding: 2px;
        flex-shrink: 0;
        overflow: hidden;
      }

      .bc-qrcode-container canvas,
      .bc-qrcode-container img {
        width: 100% !important;
        height: 100% !important;
        display: block !important;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
    <style id="interactive-list-link-style">
      .interactive-list-link {
        position: fixed;
        top: 14px;
        left: 14px;
        z-index: 10000;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 9px 13px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: rgba(3, 6, 15, 0.86);
        color: #eaf0ff;
        font: 800 12px/1.1 system-ui, -apple-system, Segoe UI, sans-serif;
        letter-spacing: 0.01em;
        text-decoration: none;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(14px);
      }

      .interactive-list-link:hover {
        border-color: rgba(34, 211, 238, 0.5);
        color: #ffffff;
      }

      html.embed .interactive-list-link {
        display: none !important;
      }

      @media print {
        .interactive-list-link {
          display: none !important;
        }
      }
    </style>
    <script>
      try {
        if (new URLSearchParams(location.search).has('embed')) document.documentElement.classList.add('embed');
      } catch (_) {}
    </script>  </head>
  <body>
    <a class="interactive-list-link" href="interactive.html">&larr; Interactive flyer list</a>
    <h1 class="sr-only">LevelUp Rewards Business Cards Builder</h1>
    <!-- CONTROL SIDEBAR -->
    <div class="control-sidebar no-print" role="complementary">
      <div class="sidebar-header">
        <span class="sidebar-logo">🪪</span>
        <div class="sidebar-title-text">
          <h2>Card Builder</h2>
          <p class="sidebar-subtitle-text">10-up Letter Print Sheet</p>
        </div>
      </div>

      <div class="sidebar-section">
        <label class="sidebar-label" for="style-select">Card Design Template</label>
        <select id="style-select" class="sidebar-select" onchange="updateCardStyle()">
          <option value="id-card" selected>ID Card Style</option>
          <option value="coupon">Coupon Style</option>
        </select>
      </div>

      <div class="sidebar-section">
        <label class="sidebar-label" for="card-design-select">Credit Card Design Theme</label>
        <select id="card-design-select" class="sidebar-select" onchange="updateCardStyle()">
          <option value="design-premium" selected>Premium Chip Card</option>
          <option value="design-diagonal">Diagonal Pass</option>
          <option value="design-clean">Clean Contact Card</option>
          <option value="design-arcade">Arcade Pass</option>
          <option value="design-school-card">School Rewards Card</option>
        </select>
      </div>

      <div class="sidebar-section">
        <label class="sidebar-label" for="theme-select">Visual Theme</label>
        <select id="theme-select" class="sidebar-select" onchange="updateTheme()">
          <option value="navy">Bold Navy</option>
          <option value="green">Emerald Forest</option>
          <option value="sunset">Purple Sunset</option>
          <option value="cyber">Classic Neon</option>
          <option value="crimson">Crimson Culture</option>
          <option value="gold">Quest Gold</option>
          <option value="aurora">Winter Aurora</option>
          <option value="sapphire">Royal Sapphire</option>
          <option value="obsidian">Grayscale Midnight</option>
          <option value="sand">Sahara Sand</option>
          <option value="light" selected>Classic Light (Default)</option>
          <option value="light-sky">Light Sky</option>
        </select>
      </div>

      <div class="sidebar-section">
        <label class="sidebar-label">Personal Details</label>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <input type="text" id="name-input" value="Dovid Teitelbaum" class="sidebar-input" placeholder="Full Name" oninput="syncFields()" />
          <input type="text" id="title-input" value="Lead Developer" class="sidebar-input" placeholder="Job Title" oninput="syncFields()" />
          <input type="text" id="badge-input" value="Developer" class="sidebar-input" placeholder="Badge/Role Label" oninput="syncFields()" />
          <input type="hidden" id="photo-input" value="/logo.png" />
        </div>
      </div>

      <div class="sidebar-section">
        <label class="sidebar-label">Contact Details</label>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <input type="text" id="email-input" value="contact@leveluprewards.app" class="sidebar-input" placeholder="Email Address" oninput="syncFields()" />
          <input type="text" id="phone-input" value="" class="sidebar-input" placeholder="Phone Number" oninput="syncFields()" />
          <input type="text" id="web-input" value="leveluprewards.app" class="sidebar-input" placeholder="Website" oninput="syncFields()" />
        </div>
      </div>
      
      <div class="sidebar-section">
        <label class="sidebar-label">Branding</label>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <input type="text" id="company-input" value="LevelUp Rewards" class="sidebar-input" placeholder="Company/App Name" oninput="syncFields()" />
          <input type="text" id="tagline-input" value="PBIS & Climate" class="sidebar-input" placeholder="Tagline" oninput="syncFields()" />
        </div>
      </div>

      <div style="margin-top: auto; padding-top: 10px;">
        <button class="sidebar-btn" onclick="window.print()">
          🖨️ Print / Save PDF
        </button>
      </div>
    </div>

    <!-- MAIN PREVIEW PANEL -->
    <div class="proposal-main">
      <div class="page" id="sheet-1" aria-label="Business card print sheet">
        <!-- 10 cards generated via JS -->
      </div>
    </div>

    <script>
      const THEMES = {
        navy: {
          '--bg': '#0b1220', '--accent': '#7c3aed', '--accent2': '#06b6d4',
          '--panel': 'rgba(255, 255, 255, 0.05)', '--text': '#eaf0ff',
          '--muted': 'rgba(234, 240, 255, 0.78)', '--hair': 'rgba(234, 240, 255, 0.15)',
          '--success': '#22c55e', '--black': '#0a0a0a', '--strong': '#ffffff',
          '--heading-color': 'var(--accent2)'
        },
        green: {
          '--bg': '#041d1a', '--accent': '#059669', '--accent2': '#10b981',
          '--panel': 'rgba(255, 255, 255, 0.05)', '--text': '#ecfdf5',
          '--muted': 'rgba(236, 253, 245, 0.78)', '--hair': 'rgba(236, 253, 245, 0.15)',
          '--success': '#34d399', '--black': '#020d0c', '--strong': '#ffffff',
          '--heading-color': 'var(--accent2)'
        },
        sunset: {
          '--bg': '#1a0b18', '--accent': '#db2777', '--accent2': '#f97316',
          '--panel': 'rgba(255, 255, 255, 0.05)', '--text': '#fdf2f8',
          '--muted': 'rgba(253, 242, 248, 0.78)', '--hair': 'rgba(253, 242, 248, 0.15)',
          '--success': '#22c55e', '--black': '#090208', '--strong': '#ffffff',
          '--heading-color': 'var(--accent2)'
        },
        cyber: {
          '--bg': '#08070d', '--accent': '#d946ef', '--accent2': '#f43f5e',
          '--panel': 'rgba(255, 255, 255, 0.05)', '--text': '#fae8ff',
          '--muted': 'rgba(250, 232, 255, 0.78)', '--hair': 'rgba(250, 232, 255, 0.15)',
          '--success': '#10b981', '--black': '#030205', '--strong': '#ffffff',
          '--heading-color': 'var(--accent2)'
        },
        crimson: {
          '--bg': '#1e050b', '--accent': '#e11d48', '--accent2': '#fb7185',
          '--panel': 'rgba(255, 255, 255, 0.05)', '--text': '#fff1f2',
          '--muted': 'rgba(255, 241, 242, 0.78)', '--hair': 'rgba(255, 241, 242, 0.15)',
          '--success': '#10b981', '--black': '#0a0103', '--strong': '#ffffff',
          '--heading-color': 'var(--accent2)'
        },
        gold: {
          '--bg': '#1a1206', '--accent': '#d97706', '--accent2': '#fbbf24',
          '--panel': 'rgba(255, 255, 255, 0.05)', '--text': '#fef3c7',
          '--muted': 'rgba(254, 243, 199, 0.78)', '--hair': 'rgba(254, 243, 199, 0.15)',
          '--success': '#10b981', '--black': '#0a0702', '--strong': '#ffffff',
          '--heading-color': 'var(--accent2)'
        },
        aurora: {
          '--bg': '#061318', '--accent': '#06b6d4', '--accent2': '#10b981',
          '--panel': 'rgba(255, 255, 255, 0.05)', '--text': '#ecfeff',
          '--muted': 'rgba(236, 254, 255, 0.78)', '--hair': 'rgba(236, 254, 255, 0.15)',
          '--success': '#34d399', '--black': '#020709', '--strong': '#ffffff',
          '--heading-color': 'var(--accent2)'
        },
        sapphire: {
          '--bg': '#0a0e1c', '--accent': '#3b82f6', '--accent2': '#6366f1',
          '--panel': 'rgba(255, 255, 255, 0.05)', '--text': '#eff6ff',
          '--muted': 'rgba(239, 246, 255, 0.78)', '--hair': 'rgba(239, 246, 255, 0.15)',
          '--success': '#10b981', '--black': '#04060c', '--strong': '#ffffff',
          '--heading-color': 'var(--accent2)'
        },
        obsidian: {
          '--bg': '#0d0d0e', '--accent': '#f3f4f6', '--accent2': '#9ca3af',
          '--panel': 'rgba(255, 255, 255, 0.05)', '--text': '#f9fafb',
          '--muted': 'rgba(249, 250, 251, 0.78)', '--hair': 'rgba(249, 250, 251, 0.15)',
          '--success': '#10b981', '--black': '#050506', '--strong': '#ffffff',
          '--heading-color': 'var(--accent2)'
        },
        sand: {
          '--bg': '#1a0f0a', '--accent': '#ea580c', '--accent2': '#f59e0b',
          '--panel': 'rgba(255, 255, 255, 0.05)', '--text': '#fff7ed',
          '--muted': 'rgba(255, 247, 237, 0.78)', '--hair': 'rgba(255, 247, 237, 0.15)',
          '--success': '#10b981', '--black': '#0a0604', '--strong': '#ffffff',
          '--heading-color': 'var(--accent2)'
        },
        light: {
          '--bg': '#ffffff', '--accent': '#4f46e5', '--accent2': '#0ea5e9',
          '--panel': 'rgba(15, 23, 42, 0.04)', '--text': '#0f172a',
          '--muted': '#475569', '--hair': 'rgba(15, 23, 42, 0.12)',
          '--success': '#16a34a', '--black': '#ffffff', '--strong': '#090d16',
          '--heading-color': 'var(--accent)'
        },
        'light-sky': {
          '--bg': '#f0f9ff', '--accent': '#0284c7', '--accent2': '#0ea5e9',
          '--panel': 'rgba(2, 132, 199, 0.04)', '--text': '#0f172a',
          '--muted': '#334155', '--hair': 'rgba(2, 132, 199, 0.12)',
          '--success': '#16a34a', '--black': '#ffffff', '--strong': '#031b2b',
          '--heading-color': 'var(--accent)'
        }
      };

      let currentStyle = 'id-card';
      let currentCardDesign = 'design-premium';

      function generateCards() {
        const sheet = document.getElementById('sheet-1');
        sheet.innerHTML = '';
        
        let cardTemplate = '';
        if (currentStyle === 'coupon') {
          cardTemplate = `
            <div class="bcard-container">
              <div class="coupon-scalable">
                <div class="coupon-title">
                  <img src="/logo.png" alt="LevelUp logo" />
                  <span class="sync-company-tagline">LevelUp Rewards - PBIS & Climate</span>
                </div>
                
                <div class="coupon-main">
                  <div class="coupon-left-badge">
                    <span class="sync-badge">Staff</span>
                  </div>
                  <div class="coupon-details-text">
                    <div class="coupon-name sync-name">Jane Doe</div>
                    <div class="coupon-category sync-title">PBIS Coordinator</div>
                  </div>
                </div>
                
                <div class="coupon-barcode-zone">
                  <div class="coupon-redemption-label">
                    <span class="sync-email">contact@leveluprewards.app</span>
                    <span class="sync-separator" style="margin: 0 4px;">·</span>
                    <span class="sync-web">leveluprewards.app</span>
                  </div>
                  <div class="bc-qrcode-container sync-qrcode-container" style="width: 36px; height: 36px;"></div>
                </div>
              </div>
            </div>
          `;
        } else {
          cardTemplate = `
            <div class="bcard-container">
              <div class="print-id-card ${currentCardDesign}">
                <div class="bc-decor"></div>
                <div class="bc-decor2"></div>
                
                <div class="print-id-header-container">
                  <div class="print-id-app">
                    <div class="print-id-app-logo">
                      <img src="/logo.png" alt="Logo" />
                    </div>
                    <div class="print-id-app-text">
                      <span class="print-id-app-name sync-company">LevelUp Rewards</span>
                      <span class="print-id-app-tagline sync-tagline">PBIS & Climate</span>
                    </div>
                  </div>
                  <div class="print-id-school">
                    <span class="print-id-header sync-badge">Staff</span>
                  </div>
                </div>
                
                <div class="print-id-main">
                  <div class="print-id-left">
                    <div class="print-id-avatar">
                      <img src="/logo.png" alt="LevelUp logo" class="sync-avatar" onerror="handleImageError(this)" />
                      <div class="bc-avatar-fallback">LU</div>
                    </div>
                    <div class="print-id-text">
                      <div class="print-id-name sync-name">Jane Doe</div>
                      <div class="print-id-class sync-title">PBIS Coordinator</div>
                      <div class="print-id-meta-info" style="font-size: 8px; opacity: 0.8; margin-top: 3px; display: flex; flex-direction: column; gap: 1px;">
                        <div class="sync-email-row" style="display: flex; align-items: center; gap: 4px;">
                          <span style="color: var(--accent2)">✉</span>
                          <span class="sync-email">contact@leveluprewards.app</span>
                        </div>
                        <div class="sync-phone-row" style="display: flex; align-items: center; gap: 4px;">
                          <span style="color: var(--accent2)">☎</span>
                          <span class="sync-phone"></span>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
                
                <div class="print-id-barcode-container">
                  <div class="bc-qrcode-container sync-qrcode-container" style="width: 38px; height: 38px;"></div>
                </div>
              </div>
            </div>
          `;
        }

        for (let i = 0; i < 10; i++) {
          sheet.innerHTML += cardTemplate;
        }
      }

      function handleImageError(img) {
        img.style.display = 'none';
        const fallback = img.nextElementSibling;
        if (fallback) {
          fallback.style.display = 'flex';
        }
      }

      function updateCardStyle() {
        currentStyle = document.getElementById('style-select').value;
        currentCardDesign = document.getElementById('card-design-select').value;
        
        // Regenerate card DOM templates
        generateCards();
        // Re-apply theme visual variables
        updateTheme();
        // Sync control inputs to card targets
        syncFields();
      }

      function updateTheme() {
        const themeKey = document.getElementById('theme-select').value;
        const theme = THEMES[themeKey] || THEMES.navy;
        const root = document.documentElement;
        
        for (const [key, value] of Object.entries(theme)) {
          root.style.setProperty(key, value);
        }

        const isLight = themeKey.startsWith('light');
        const cards = document.querySelectorAll('.bcard, .print-id-card, .coupon-scalable');
        
        cards.forEach(card => {
          if (isLight) {
            card.style.border = '1px solid var(--hair)';
          } else {
            // Keep dashed borders on coupon style intact
            if (!card.classList.contains('coupon-scalable')) {
              card.style.border = 'none';
            }
          }
        });
      }

      function syncFields() {
        const name = document.getElementById('name-input').value;
        const title = document.getElementById('title-input').value;
        const badge = document.getElementById('badge-input').value;
        const email = document.getElementById('email-input').value;
        const phone = document.getElementById('phone-input').value;
        const web = document.getElementById('web-input').value;
        const company = document.getElementById('company-input').value;
        const tagline = document.getElementById('tagline-input').value;
        const photo = '/logo.png';

        updateElements('.sync-name', name);
        updateElements('.sync-title', title);
        updateElements('.sync-badge', badge);
        updateElements('.sync-email', email);
        updateElements('.sync-phone', phone);
        updateElements('.sync-web', web);
        updateElements('.sync-company', company);
        updateElements('.sync-tagline', tagline);

        // Header sync for coupon style
        const companyTaglineText = `${company} - ${tagline}`;
        updateElements('.sync-company-tagline', companyTaglineText);

        document.querySelectorAll('.bc-avatar-fallback').forEach(el => {
          el.textContent = 'LU';
        });

        // Use the LevelUp logo in the business card image slot.
        document.querySelectorAll('.sync-avatar').forEach(img => {
          const fallback = img.nextElementSibling;
          if (currentStyle !== 'coupon') {
            img.src = photo;
            img.style.display = 'block';
            fallback.style.display = 'none';
          } else {
            img.src = '';
            img.style.display = 'none';
            fallback.style.display = 'flex';
          }
        });

        // Sync QR code source linking directly to the site URL using local QRCode.js
        document.querySelectorAll('.sync-qrcode-container').forEach(container => {
          container.innerHTML = '';
          if (web && web.trim()) {
            const url = web.startsWith('http') ? web : 'https://' + web;
            if (typeof QRCode !== 'undefined') {
              new QRCode(container, {
                text: url,
                width: currentStyle === 'coupon' ? 36 : 38,
                height: currentStyle === 'coupon' ? 36 : 38,
                colorDark: '#000000',
                colorLight: '#ffffff',
                correctLevel: QRCode.CorrectLevel.H
              });
              container.style.display = 'flex';
            } else {
              container.innerHTML = '<span style="font-size: 8px; color: #000; text-align: center;">QR</span>';
              container.style.display = 'flex';
            }
          } else {
            container.style.display = 'none';
          }
        });

        // Hide empty rows/badges/containers if empty
        document.querySelectorAll('.sync-email-row').forEach(el => el.style.display = email ? 'flex' : 'none');
        document.querySelectorAll('.sync-phone-row').forEach(el => el.style.display = phone ? 'flex' : 'none');
        document.querySelectorAll('.sync-web-row').forEach(el => el.style.display = web ? 'flex' : 'none');
        
        // Hide separator dot in coupon style if email or web is empty
        document.querySelectorAll('.sync-separator').forEach(el => {
          el.style.display = (email && web) ? 'inline' : 'none';
        });
      }

      function updateElements(selector, value) {
        document.querySelectorAll(selector).forEach(el => {
          el.textContent = value;
        });
      }

      // Check if URL has ?embed=1 and hide sidebar accordingly
      if (new URLSearchParams(window.location.search).has('embed')) {
        document.querySelector('.control-sidebar').style.display = 'none';
        document.querySelector('.proposal-main').style.padding = '0';
      }

      // Initialize
      generateCards();
      updateTheme();
      syncFields();
    </script>
  </body>
</html>
